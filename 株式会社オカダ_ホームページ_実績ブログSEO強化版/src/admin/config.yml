backend:
  name: git-gateway
  branch: main

locale: ja
media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "blog"
    label: "ブログ"
    label_singular: "ブログ記事"
    folder: "src/blog"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "記事タイトル", name: "title", widget: "string", hint: "検索ユーザーが内容を一目で理解できる具体的なタイトルにします" }
      - { label: "SEOタイトル（任意）", name: "seoTitle", widget: "string", required: false, hint: "空欄の場合は記事タイトルを使用。目安は30〜40文字程度" }
      - { label: "検索結果の説明", name: "description", widget: "text", hint: "記事内容を1〜2文で具体的に要約" }
      - { label: "公開日", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "カテゴリー", name: "category", widget: "select", options: ["厨房機器", "店舗設計・内装", "飲食店コンサル", "集客・マーケティング", "商品開発", "人材・教育", "DX・システム", "お知らせ"] }
      - { label: "アイキャッチ画像", name: "image", widget: "image", required: false }
      - { label: "画像の説明（alt）", name: "imageAlt", widget: "string", required: false, hint: "写真に何が写っているかを自然な日本語で記載" }
      - { label: "URL", name: "permalink", widget: "string", hint: "/blog/kumamoto-restaurant-example/index.html の形で入力" }
      - { label: "OGタイプ", name: "ogType", widget: "hidden", default: "article" }
      - { label: "レイアウト", name: "layout", widget: "hidden", default: "post.njk" }
      - { label: "本文", name: "body", widget: "markdown", hint: "見出し（H2/H3）を使って読みやすく整理してください" }

  - name: "works"
    label: "施工・支援実績"
    label_singular: "実績・対応事例"
    folder: "src/works"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}} — {{category}}"
    fields:
      - { label: "タイトル", name: "title", widget: "string" }
      - { label: "SEOタイトル", name: "seoTitle", widget: "string", required: false }
      - { label: "説明", name: "description", widget: "text" }
      - { label: "掲載日", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "カテゴリー", name: "category", widget: "string" }
      - { label: "エリア", name: "location", widget: "string", required: false }
      - { label: "メイン画像", name: "image", widget: "image", required: false }
      - { label: "画像の説明（alt）", name: "imageAlt", widget: "string", required: false }
      - { label: "URL", name: "permalink", widget: "string", hint: "/works/example/index.html の形で入力" }
      - { label: "レイアウト", name: "layout", widget: "hidden", default: "work.njk" }
      - { label: "本文", name: "body", widget: "markdown" }
